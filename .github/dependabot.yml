version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    commit-message:
      prefix: "chore(deps)"
