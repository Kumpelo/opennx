name: Bug Report
description: Report a bug to help us improve OpenNX
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots.
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. Linux (Arch/NixOS/Fedora), macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenNX version
      description: e.g. 0.1.0
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context about the problem.
