name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - run: pnpm install --frozen-lockfile

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles deb

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles msi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennx-${{ matrix.target }}
          path: src-tauri/target/release/bundle/

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Extract tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Downloaded artifacts ==="
          find . -type f \( -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \) -ls
          
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find . -type f \( -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \) -print0)
      
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts were found"
            echo "=== Directory structure ==="
            find . -maxdepth 4 -type f
            exit 1
          fi
      
          echo "Found ${#files[@]} artifact(s)"
          gh release create "$TAG" \
            --title "OpenNX $TAG" \
            --generate-notes \
            "${files[@]}"
