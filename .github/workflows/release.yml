name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bundle: deb
          - target: x86_64-apple-darwin
            os: macos-latest
            bundle: dmg
          - target: aarch64-apple-darwin
            os: macos-latest
            bundle: dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundle: msi

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false

      - name: Ensure Rust components
        shell: bash
        run: |
          set -euo pipefail
          echo "=== rustc / cargo versions ==="
          rustc --version || true
          cargo --version || true
          echo "=== installed rustup targets (before) ==="
          rustup target list --installed || true
          echo "Adding rust-src component and target if missing..."
          rustup component add rust-src || true
          rustup target add "${{ matrix.target }}" || true
          echo "=== installed rustup components/targets (after) ==="
          rustup component list --installed || true
          rustup target list --installed || true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libusb-1.0-0-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p src-tauri
          echo "=== pnpm version ==="
          pnpm --version || true
          echo "=== tauri info ==="
          pnpm tauri info || true
          pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundle }}" 2>&1 | tee src-tauri/build-tauri.log
          exit_code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$exit_code" >> "$GITHUB_ENV"
          exit "$exit_code"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log-${{ matrix.target }}
          path: src-tauri/build-tauri.log
          if-no-files-found: warn

      - name: Verify artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_EXIT_CODE=${BUILD_EXIT_CODE:-unset}"
          echo "=== bundle directory listing ==="
          if [ -d src-tauri/target/release/bundle ]; then
            find src-tauri/target/release/bundle -maxdepth 5 -type f -print
          else
            echo "src-tauri/target/release/bundle does not exist"
          fi

          if [ "${BUILD_EXIT_CODE:-1}" -ne 0 ]; then
            echo "Build failed with exit code ${BUILD_EXIT_CODE:-unset}"
            exit "${BUILD_EXIT_CODE:-1}"
          fi

          mapfile -t files < <(find src-tauri/target/release/bundle -type f -name "*.${{ matrix.bundle }}" -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .${{ matrix.bundle }} artifacts found"
            exit 1
          fi

          echo "Found ${#files[@]} release artifact(s):"
          printf '%s\n' "${files[@]}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennx-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== downloaded artifacts ==="
          find artifacts -maxdepth 5 -type f -print || true

          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f \( -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \) -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No final release artifacts were found"
            exit 1
          fi

          echo "Found ${#files[@]} release artifact(s)"
          gh release create "$TAG" \
            --title "OpenNX $TAG" \
            --generate-notes \
            "${files[@]}"
