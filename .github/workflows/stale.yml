name: Stale
on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days. Remove the stale label
            or comment to keep it open, or it will be closed in 14 days.
          stale-pr-message: >
            This PR has been inactive for 60 days. Remove the stale label
            or comment to keep it open, or it will be closed in 14 days.
          days-before-stale: 60
          days-before-close: 14
          exempt-labels: blocked,security
